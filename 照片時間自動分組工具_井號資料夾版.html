<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>照片時間自動分組工具</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb;--green:#16a34a;--orange:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}
.wrap{max-width:1240px;margin:28px auto;padding:0 18px}
h1{margin:0 0 6px;font-size:28px}
.sub{color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px rgba(15,23,42,.05)}
.drop{border:2px dashed #aab8ca;border-radius:12px;padding:26px;text-align:center;background:#f9fbff}
.drop.drag{border-color:var(--blue);background:#eef5ff}
input[type=file]{display:none}
button,.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.secondary{background:#e8eef8;color:#1e3a8a}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:15px}
label{font-size:14px;font-weight:700}
select,input[type=number]{width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=range]{width:100%}
.rangeBox{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}
.rangeValue{font-weight:800;color:var(--blue)}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#60a5fa)}
.status{margin-top:8px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin-top:14px}
.item{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}
.thumb{width:100%;height:135px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:7px 0}
.item input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}
.ok{color:var(--green);font-weight:700}.bad{color:var(--orange);font-weight:700}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{padding:7px 11px;border-radius:999px;background:#edf4ff;color:#1d4ed8;font-weight:700;font-size:13px}
.hidden{display:none}
.note{font-size:13px;color:var(--muted);line-height:1.55}
.cropRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:8px 0}
.cropImg{width:100%;height:78px;object-fit:contain;border:1px solid var(--line);background:#111;border-radius:7px}
.raw{font-size:12px;color:#475569;white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:7px;border-radius:7px;min-height:42px}
.perItemRange{margin-top:8px;padding:8px;background:#f8fafc;border-radius:8px}
.small{font-size:12px;color:var(--muted)}
.vote{font-size:12px;color:#475569;margin-top:4px}

input[type=file]{display:none}.settings input[type=number],.settings select{font-size:16px}.group{padding:14px 0;border-top:1px solid var(--line)}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;margin-top:9px}.photo{min-width:0;font-size:12px;overflow-wrap:anywhere}.photo img{width:100%;height:100px;object-fit:cover;border-radius:8px;background:#eee}.photo small{display:block;color:var(--muted)}.status{white-space:pre-wrap}.note{margin-top:12px}progress{width:100%;margin-top:12px}button{touch-action:manipulation}
</style></head><body><div class="wrap"><h1>📸 照片時間自動分組工具</h1><div class="sub">依拍攝時間由舊到新，自動分組並匯出 ZIP。照片僅在本機處理。</div><div class="card"><div id="drop" class="drop"><p><b>選取多張照片（也可在電腦拖曳）</b></p><label class="btn primary" for="files">選取照片</label><input id="files" type="file" accept="image/*,.heic,.heif" multiple><p id="chosen" class="note">尚未選取照片</p></div><div class="settings"><label>每組照片張數<input id="count" type="number" min="1" max="9999" value="4"></label><label>排序依據<select id="sort"><option value="capture">拍攝時間優先</option><option value="modified">檔案修改時間</option><option value="name">檔案名稱</option></select></label></div><div class="row" style="margin-top:14px"><button id="preview" class="primary" disabled>預覽分組</button><button id="download" class="success" disabled>建立並下載 ZIP</button><button id="clear" class="secondary" disabled>清除</button></div><div class="note">無需網路或外部套件。可解析一般 JPEG 的 EXIF 拍攝時間；HEIC 等格式若無法解析，改以檔案修改時間排序。iPhone「檔案」快速查看可能限制 ZIP 儲存，若無法下載請改在完整瀏覽器開啟。</div></div><div class="card"><div id="status" class="status">請先選擇照片。</div><progress id="progress" max="100" value="0" hidden></progress><div id="summary" class="summary"></div><div id="results"></div></div></div><script>
const $=id=>document.getElementById(id);let files=[],groups=[],urls=[],busy=false;
function say(s){$('status').textContent=s}function clean(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}function safe(s){return s.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_')}function dateText(ms){return Number.isFinite(ms)?new Date(ms).toLocaleString('zh-TW',{hour12:false}):'無日期'}
function setFiles(list){files=Array.from(list).filter(f=>f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));groups=[];clean();$('results').replaceChildren();$('summary').replaceChildren();$('chosen').textContent='已選擇 '+files.length+' 張照片';$('preview').disabled=!files.length;$('clear').disabled=!files.length;$('download').disabled=true;say(files.length?'已選擇 '+files.length+' 張，請按「預覽分組」。':'請先選擇照片。')}
$('files').addEventListener('change',e=>setFiles(e.target.files));const drop=$('drop');['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{setFiles(e.dataTransfer.files)});$('clear').onclick=()=>{$('files').value='';setFiles([])};['count','sort'].forEach(id=>$(id).addEventListener('change',()=>{$('download').disabled=true;groups=[];say('設定已變更，請重新預覽分組。')}));
// JPEG APP1 TIFF EXIF DateTimeOriginal (0x9003), DateTimeDigitized (0x9004), DateTime (0x0132)
async function jpegDate(file){if(!/\.(jpg|jpeg)$/i.test(file.name)&&!(/jpeg/i.test(file.type)))return NaN;const buf=await file.slice(0,262144).arrayBuffer(),d=new DataView(buf);if(d.byteLength<12||d.getUint16(0)!==0xffd8)return NaN;let p=2;while(p+4<d.byteLength){if(d.getUint8(p)!==255)break;const marker=d.getUint8(p+1),len=d.getUint16(p+2);if(len<2||p+2+len>d.byteLength)break;if(marker===0xe1&&len>=14&&d.getUint32(p+4)===0x45786966&&d.getUint16(p+8)===0){let t=p+10,end=p+2+len;let le=d.getUint16(t)===0x4949;if(!le&&d.getUint16(t)!==0x4d4d)break;let u16=x=>d.getUint16(x,le),u32=x=>d.getUint32(x,le);if(u16(t+2)!==42)break;function scan(offset,depth){if(depth>3)return NaN;let at=t+offset;if(at<t||at+2>end)return NaN;let count=u16(at);if(count>1000)return NaN;let fallback=NaN;for(let j=0;j<count;j++){let e=at+2+j*12;if(e+12>end)break;let tag=u16(e),type=u16(e+2),n=u32(e+4),v=u32(e+8);if((tag===0x9003||tag===0x9004||tag===0x0132)&&type===2&&n>=19&&n<128){let pos=n<=4?e+8:t+v;if(pos>=t&&pos+n<=end){let s='';for(let k=0;k<19;k++)s+=String.fromCharCode(d.getUint8(pos+k));let m=s.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);if(m){let ms=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();if(Number.isFinite(ms)){if(tag===0x9003)return ms;fallback=ms}}}}if(tag===0x8769&&v){let sub=scan(v,depth+1);if(Number.isFinite(sub))return sub}}return fallback}return scan(u32(t+4),0)}p+=len+2}return NaN}
async function prepare(){if(busy)return;let n=Number($('count').value);if(!files.length){say('請先選擇照片');return}if(!Number.isInteger(n)||n<1){say('每組張數請輸入正整數');return}busy=true;$('preview').disabled=true;$('download').disabled=true;clean();$('results').replaceChildren();let mode=$('sort').value,items=[],fallback=0;try{for(let i=0;i<files.length;i++){let f=files[i],ms=NaN;if(mode==='capture'){try{ms=await jpegDate(f)}catch(e){}}let usedFallback=!Number.isFinite(ms);if(usedFallback){ms=f.lastModified||0;if(mode==='capture')fallback++}items.push({file:f,ms,idx:i,usedFallback});if(i%5===0){say('正在讀取照片時間：'+(i+1)+' / '+files.length);await new Promise(r=>setTimeout(r,0))}}items.sort((a,b)=>mode==='name'?a.file.name.localeCompare(b.file.name,'zh-Hant',{numeric:true})||a.idx-b.idx:a.ms-b.ms||a.idx-b.idx);groups=[];for(let i=0;i<items.length;i+=n)groups.push(items.slice(i,i+n));say('共 '+files.length+' 張，分成 '+groups.length+' 組。'+(mode==='capture'&&fallback?'\n其中 '+fallback+' 張未讀到 JPEG 拍攝時間，已改用檔案修改時間。':''));$('summary').textContent='每組 '+n+' 張，最後一組可能不足 '+n+' 張。';let frag=document.createDocumentFragment();groups.forEach((g,i)=>{let div=document.createElement('div');div.className='group';let title=document.createElement('b');title.textContent='#'+String(i+1)+'（'+g.length+' 張）';div.append(title);let photos=document.createElement('div');photos.className='photos';g.forEach(it=>{let p=document.createElement('div');p.className='photo';let img=document.createElement('img');let u=URL.createObjectURL(it.file);urls.push(u);img.src=u;img.loading='lazy';let cap=document.createElement('div');cap.textContent=it.file.name;let time=document.createElement('small');time.textContent=mode==='name'?'':dateText(it.ms)+(it.usedFallback&&mode==='capture'?'（備用）':'');p.append(img,cap,time);photos.append(p)});div.append(photos);frag.append(div)});$('results').append(frag);$('download').disabled=false}catch(e){say('預覽失敗：'+e.message)}finally{busy=false;$('preview').disabled=false}}
$('preview').onclick=prepare;
// Self-contained ZIP writer: STORE method, CRC32, no external library. UTF-8 filenames.
const encoder=new TextEncoder();let crcTable=(()=>{let t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[i]=c>>>0}return t})();function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++)c=crcTable[(c^bytes[i])&255]^(c>>>8);return(c^0xffffffff)>>>0}function u16(v){return [v&255,(v>>>8)&255]}function u32(v){return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}function dosDate(ms){let d=new Date(ms||Date.now()),year=Math.max(1980,Math.min(2107,d.getFullYear()));return {time:(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date:((year-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}}
async function buildZip(){if(busy||!groups.length)return;busy=true;$('download').disabled=true;$('preview').disabled=true;$('progress').hidden=false;$('progress').value=0;try{let parts=[],central=[],offset=0,entryCount=0,total=groups.reduce((a,g)=>a+g.length,0),done=0,root='照片自動分組/',digits=Math.max(2,String(groups.length).length);for(let i=0;i<groups.length;i++){let used=new Set(),folder=root+'#'+String(i+1)+'/';for(let item of groups[i]){let original=safe(item.file.name)||'照片',dot=original.lastIndexOf('.'),base=dot>0?original.slice(0,dot):original,ext=dot>0?original.slice(dot):'',name=original,k=2;while(used.has(name))name=base+'_'+k+++ext;used.add(name);let path=encoder.encode(folder+name),data=new Uint8Array(await item.file.arrayBuffer()),crc=crc32(data),dt=dosDate(item.ms),size=data.byteLength;if(size>0xffffffff)throw Error('單張照片超過 ZIP 4GB 限制');let local=new Uint8Array([80,75,3,4,...u16(20),...u16(0x800),...u16(0),...u16(dt.time),...u16(dt.date),...u32(crc),...u32(size),...u32(size),...u16(path.length),...u16(0)]);parts.push(local,path,data);let cd=new Uint8Array([80,75,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(dt.time),...u16(dt.date),...u32(crc),...u32(size),...u32(size),...u16(path.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);central.push(cd,path);offset+=local.length+path.length+size;entryCount++;done++;$('progress').value=done/total*100;say('正在建立 ZIP：'+done+' / '+total+' 張');if(offset>0xffffffff)throw Error('總檔案超過 ZIP 4GB 限制');await new Promise(r=>setTimeout(r,0))}}let cdsize=central.reduce((s,x)=>s+x.byteLength,0);if(entryCount>65535)throw Error('ZIP 檔案數量過多');let end=new Uint8Array([80,75,5,6,...u16(0),...u16(0),...u16(entryCount),...u16(entryCount),...u32(cdsize),...u32(offset),...u16(0)]);let blob=new Blob([...parts,...central,end],{type:'application/zip'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='照片自動分組.zip';document.body.appendChild(a);a.click();a.remove();say('ZIP 已建立，共 '+groups.length+' 組、'+total+' 張。若沒有跳出下載或儲存選項，代表目前的 iPhone 檔案預覽器限制了下載。');setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){say('建立 ZIP 失敗：'+e.message+'。照片過多時請分批處理。')}finally{busy=false;$('download').disabled=false;$('preview').disabled=false;$('progress').hidden=true}}
$('download').onclick=buildZip;
</script></body></html>
